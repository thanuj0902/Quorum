    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Quorum AI fact-checking?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Quorum is a free multi-agent AI fact-verification system that uses four independent AI agents to research claims, cross-verify facts, detect hallucinations, and compile citation-backed reports with per-claim confidence scores."
          }
        },
        {
          "@type": "Question",
          "name": "How does multi-agent verification work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Each claim goes through four specialized AI agents in sequence: a Research Agent gathers sources, a Verification Agent cross-checks facts, a Hallucination Detector flags fabricated data, and a Synthesis Agent compiles the final report."
          }
        },
        {
          "@type": "Question",
          "name": "Is Quorum free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Quorum is completely free to use. It offers a demo mode that works without an API key, and a live mode that uses your own Anthropic API key for real AI-powered verification."
          }
        },
        {
          "@type": "Question",
          "name": "Can I share fact-check reports?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Quorum generates unique shareable links for every completed report. You can share these links with anyone and they can view the full report without needing an account."
          }
        }
      ]
    }
    </script>

      "description": "Building transparent, multi-agent AI tools for fact-verification and research."

    </script>
